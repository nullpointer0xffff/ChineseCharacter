name: ChineseCharacter
options:
  bundleIdPrefix: com.jiehu
  deploymentTarget:
    iOS: "17.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
targets:
  ChineseCharacterApp:
    type: application
    platform: iOS
    sources:
      - path: ChineseCharacterApp/Sources/ChineseCharacterApp
    resources:
      - path: ChineseCharacterApp/Sources/ChineseCharacterApp/Resources
    info:
      path: ChineseCharacterApp/Sources/ChineseCharacterApp/Support/Info.plist
      properties:
        CFBundleDisplayName: 中文写字
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 需要使用麦克风录下孩子想学习的中文。
        NSSpeechRecognitionUsageDescription: 录音会发送到 OpenAI 语音模型转写中文。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.jiehu.ChineseCharacter
      DEVELOPMENT_TEAM: HUTA7Y38YP
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      TARGETED_DEVICE_FAMILY: "1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
